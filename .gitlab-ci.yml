# .gitlab-ci.yml — AI Gateway build & publish pipeline
#
# Stages:
#   build   — compile the React frontend (all branches + tags)
#   mobile  — push iOS to GitHub mirror; build & sign Android
#   package — build the Docker image and push on master / git tags
#   release — publish iOS to TestFlight, Android to Play Store
#
# Required CI/CD variables (Settings → CI/CD → Variables):
#
#   Server image:
#     REGISTRY_USER             username for int-docker-reg.myra.security
#     REGISTRY_PASS             password / token  ← Masked
#
#   iOS release:
#     IOS_MIRROR_GITHUB_PAT     GitHub PAT with repo write to myraai-ios  ← Masked
#     CODEMAGIC_API_TOKEN       Codemagic personal access token  ← Masked
#     CODEMAGIC_APP_ID          Codemagic app ID
#     ASC_ISSUER_ID             App Store Connect API issuer ID
#     ASC_KEY_ID                App Store Connect API key ID  ← Masked
#     ASC_PRIVATE_KEY           ASC API .p8 contents  ← File-type variable
#
#   Android release:
#     ANDROID_PLAY_SA_JSON      Google Play service account JSON  ← File-type variable
#     ANDROID_KEYSTORE_BASE64   base64-encoded release.jks
#     ANDROID_KEYSTORE_PASS     keystore password  ← Masked
#     ANDROID_KEY_ALIAS         signing key alias
#     ANDROID_KEY_PASS          key password  ← Masked
#
# Optional variable overrides (add in CI/CD → Variables to customise):
#   VITE_ADMIN_URL      default: https://ai-api-admin.myra.eu/admin/v1
#   VITE_AUTH_URL       default: https://ai-api-admin.myra.eu/admin/auth
#   VITE_GATEWAY_URL    default: https://ai-api.myra.eu
#   VITE_DOCS_URL       default: https://ai-docs.myra.eu
#
# Mobile release flow (zero manual steps):
#   - Push to master with iOS changes  → iOS app is uploaded + submitted to TestFlight Beta App Review
#   - Push to master with Android changes → AAB built + uploaded to Play Store internal track
#   - Tag v*.*.*                       → AAB uploaded to Play Store production track
#
# On the production server, to deploy a new image:
#   docker compose pull && docker compose up -d

variables:
  REGISTRY: "int-docker-reg.myra.security"
  IMAGE: "$REGISTRY/ai-gateway"
  # DinD requires TLS certificates to be shared between the service and client
  DOCKER_TLS_CERTDIR: "/certs"

stages:
  - build
  - mobile
  - package
  - release

# ── Build the React frontend ─────────────────────────────────────────────────
build:frontend:
  stage: build
  tags: [preprod]
  image: node:20-alpine
  variables:
    # These are baked into the JS bundle at build time.
    # Override in GitLab CI/CD variables if you deploy to different URLs.
    VITE_ADMIN_URL:   "https://ai-api-admin.myra.eu/admin/v1"
    VITE_AUTH_URL:    "https://ai-api-admin.myra.eu/admin/auth"
    VITE_GATEWAY_URL: "https://ai-api.myra.eu"
    VITE_DOCS_URL:    "https://ai-docs.myra.eu"
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/node_modules/
  script:
    - cd frontend
    - npm ci --prefer-offline
    - npm run build
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 2 hours
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

# ── Build Docker image and push on master / tags ──────────────────────────────
build:docker:
  stage: package
  tags: [docker-dind]
  image: docker:24
  services:
    - docker:24-dind
  needs:
    - job: build:frontend
      artifacts: true
  before_script:
    - docker login -u "$REGISTRY_USER" -p "$REGISTRY_PASS" "$REGISTRY"
  script:
    # docs/out/ must exist for the COPY in the Dockerfile to succeed.
    # If you want docs included in the image, replace this with the actual
    # build command:  cd docs && sh gen_docs.sh
    - mkdir -p docs/out

    # Build the image and tag with the short commit SHA for traceability.
    - docker build -t "${IMAGE}:${CI_COMMIT_SHORT_SHA}" .

    # Push to the registry only on master (as :latest + :<sha>) or on a git
    # tag (as :<tag> + :<sha>).  Feature branch builds validate the image
    # builds cleanly but nothing is pushed.
    - |
      if [ "$CI_COMMIT_BRANCH" = "master" ]; then
        docker tag "${IMAGE}:${CI_COMMIT_SHORT_SHA}" "${IMAGE}:latest"
        docker push "${IMAGE}:${CI_COMMIT_SHORT_SHA}"
        docker push "${IMAGE}:latest"
        echo "Pushed ${IMAGE}:latest and ${IMAGE}:${CI_COMMIT_SHORT_SHA}"

      elif [ -n "$CI_COMMIT_TAG" ]; then
        docker tag "${IMAGE}:${CI_COMMIT_SHORT_SHA}" "${IMAGE}:${CI_COMMIT_TAG}"
        docker push "${IMAGE}:${CI_COMMIT_SHORT_SHA}"
        docker push "${IMAGE}:${CI_COMMIT_TAG}"
        echo "Pushed ${IMAGE}:${CI_COMMIT_TAG} and ${IMAGE}:${CI_COMMIT_SHORT_SHA}"

      else
        echo "Branch build — image built but not pushed (${CI_COMMIT_BRANCH})"
      fi
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

# ── iOS: push src/mobile/ios/ to public GitHub mirror (Codemagic clones from there) ──
ios:mirror:
  stage: mobile
  tags: [preprod]
  image:
    name: alpine/git
    entrypoint: [""]   # alpine/git defaults entrypoint to `git`; override so /bin/sh runs script lines
  needs: []  # independent of build:frontend — iOS doesn't need the React bundle
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master"
      changes:
        - src/mobile/ios/**/*
    - if: $RUN_IOS == "true"   # API-triggered runs (POST /pipeline with RUN_IOS=true)
  script:
    - apk add --no-cache bash
    - |
      TMP=$(mktemp -d)
      git init "$TMP"
      git -C "$TMP" checkout -b main
      cp -r src/mobile/ios/. "$TMP/"
      git -C "$TMP" config user.email "ci@myra.security"
      git -C "$TMP" config user.name  "GitLab CI"
      git -C "$TMP" add .
      git -C "$TMP" commit -m "sync: $CI_COMMIT_SHORT_SHA — $CI_COMMIT_TITLE"
      git -C "$TMP" push --force \
        "https://${IOS_MIRROR_GITHUB_PAT}@github.com/Myra-Security-GmbH/myraai-ios.git" main

# ── iOS: trigger Codemagic build (Codemagic clones the GitHub mirror, archives, uploads) ──
ios:build:
  stage: mobile
  tags: [preprod]
  image: python:3.12-alpine
  timeout: 30 minutes  # Codemagic build typically completes in 5-10 min; 30 is plenty of headroom
  needs:
    - job: ios:mirror
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master"
      changes:
        - src/mobile/ios/**/*
    - if: $RUN_IOS == "true"
  script:
    - apk add --no-cache curl
    # Layer 1: cancel any in-flight Codemagic builds for this workflow before
    # triggering a new one. Stale builds from superseded pipelines just hog
    # the Mac mini and never produce useful output.
    - |
      python3 - <<'PYEOF'
      import os, json
      from urllib.request import urlopen, Request
      from urllib.error import HTTPError

      token = os.environ["CODEMAGIC_API_TOKEN"]
      app   = os.environ["CODEMAGIC_APP_ID"]
      hdrs  = {"x-auth-token": token}

      try:
          r = urlopen(Request(f"https://api.codemagic.io/builds?appId={app}", headers=hdrs))
          data = json.loads(r.read())
      except HTTPError as e:
          print(f"WARN: list builds failed: {e.code}: {e.read().decode()}")
          raise SystemExit(0)  # don't block trigger if list fails

      builds = data if isinstance(data, list) else data.get("builds", [])
      in_flight = {"queued","preparing","fetching","testing","building","publishing"}
      cancelled = 0
      for b in builds:
          if b.get("workflowId") != "ios-app-store":
              continue
          if b.get("status") not in in_flight:
              continue
          bid = b.get("_id")
          try:
              urlopen(Request(f"https://api.codemagic.io/builds/{bid}/cancel",
                              method="POST", headers=hdrs))
              print(f"  cancelled stale build {bid} (was {b.get('status')})")
              cancelled += 1
          except HTTPError as e:
              print(f"  WARN: cancel {bid} failed: {e.code}: {e.read().decode()}")
      print(f"Cancelled {cancelled} in-flight build(s) before triggering")
      PYEOF
    # Trigger the new build.
    - |
      RESP=$(curl -sS -X POST https://api.codemagic.io/builds \
        -H "x-auth-token: $CODEMAGIC_API_TOKEN" \
        -H "Content-Type: application/json" \
        -d "{\"appId\": \"$CODEMAGIC_APP_ID\", \"workflowId\": \"ios-app-store\", \"branch\": \"main\"}")
      BUILD_ID=$(echo "$RESP" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('buildId') or d.get('build',{}).get('_id',''))")
      [ -z "$BUILD_ID" ] && echo "FAIL: $RESP" && exit 1
      echo "Codemagic build: https://codemagic.io/app/$CODEMAGIC_APP_ID/build/$BUILD_ID"
      echo "$BUILD_ID" > codemagic_build_id.txt
    # Poll until terminal. On finished, capture the buildNumber Codemagic used —
    # that's the CFBundleVersion that landed in App Store Connect (Layer 2).
    - |
      BUILD_ID=$(cat codemagic_build_id.txt)
      while :; do
        BODY=$(curl -sS -H "x-auth-token: $CODEMAGIC_API_TOKEN" \
          "https://api.codemagic.io/builds/$BUILD_ID")
        STATUS=$(echo "$BODY" | python3 -c "import json,sys; print(json.load(sys.stdin).get('build',{}).get('status','unknown'))")
        echo "$(date +%H:%M:%S)  status=$STATUS"
        case "$STATUS" in
          finished)
            BUILD_NUMBER=$(echo "$BODY" | python3 -c "import json,sys; print(json.load(sys.stdin).get('build',{}).get('index',''))")
            [ -z "$BUILD_NUMBER" ] && echo "FAIL: Codemagic returned no build index" && exit 1
            echo "$BUILD_NUMBER" > codemagic_build_number.txt
            echo "Build finished — pinned CFBundleVersion=$BUILD_NUMBER (Codemagic build index)"
            exit 0
            ;;
          failed|canceled|timeout) exit 1 ;;
        esac
        sleep 30
      done
  artifacts:
    paths:
      - codemagic_build_id.txt
      - codemagic_build_number.txt
    expire_in: 1 day

# ── iOS: submit the new build to Beta App Review (zero clicks, zero waiting on humans) ──
ios:submit-for-review:
  stage: release
  tags: [preprod]
  image: python:3.12-alpine
  needs:
    - job: ios:build
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master"
      changes:
        - src/mobile/ios/**/*
    - if: $RUN_IOS == "true"
  script:
    - pip install --quiet cryptography
    - |
      python3 <<'PYEOF'
      import os, time, base64, json
      from urllib.request import urlopen, Request
      from urllib.error import HTTPError
      from cryptography.hazmat.primitives.serialization import load_pem_private_key
      from cryptography.hazmat.primitives.asymmetric.ec import ECDSA
      from cryptography.hazmat.primitives.hashes import SHA256
      from cryptography.hazmat.primitives.asymmetric.utils import decode_dss_signature

      issuer = os.environ["ASC_ISSUER_ID"]
      key_id = os.environ["ASC_KEY_ID"]
      with open(os.environ["ASC_PRIVATE_KEY"], "rb") as f:
          priv_pem = f.read()

      now = int(time.time())
      header  = base64.urlsafe_b64encode(json.dumps({"alg":"ES256","kid":key_id,"typ":"JWT"}).encode()).rstrip(b"=")
      payload = base64.urlsafe_b64encode(json.dumps({"iss":issuer,"iat":now,"exp":now+1200,"aud":"appstoreconnect-v1"}).encode()).rstrip(b"=")
      msg = header + b"." + payload
      key = load_pem_private_key(priv_pem.strip(), password=None)
      sig = key.sign(msg, ECDSA(SHA256()))
      r, s = decode_dss_signature(sig)
      raw_sig = r.to_bytes(32,"big") + s.to_bytes(32,"big")
      token = (msg + b"." + base64.urlsafe_b64encode(raw_sig).rstrip(b"=")).decode()

      BASE = "https://api.appstoreconnect.apple.com"
      hdrs = {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}

      def call(method, path, body=None, raise_on_error=False):
          data = json.dumps(body).encode() if body else None
          req = Request(f"{BASE}{path}", data=data, headers=hdrs, method=method)
          try:
              with urlopen(req) as r:
                  c = r.read()
                  return (json.loads(c) if c else {}, None)
          except HTTPError as e:
              body = e.read().decode()
              if raise_on_error:
                  raise
              print(f"  HTTP {e.code}: {body}")
              return (None, body)

      APP_ID = "6764008556"

      # Layer 2: read the pinned buildNumber that ios:build captured. Submit
      # that exact ASC build, not "latest VALID" — avoids race conditions when
      # a stale Codemagic build from a superseded pipeline finishes mid-flight.
      try:
          with open("codemagic_build_number.txt") as f:
              target_version = f.read().strip()
      except FileNotFoundError:
          raise SystemExit("FAIL: codemagic_build_number.txt artifact missing — ios:build must run first")
      if not target_version:
          raise SystemExit("FAIL: codemagic_build_number.txt is empty")
      print(f"Target build version (CFBundleVersion): {target_version}")

      # ASC processing happens after Codemagic upload finishes — the build may
      # not be VALID yet for a few seconds. Poll for both presence + VALID.
      build_id = None
      for attempt in range(20):
          builds, _ = call("GET", f"/v1/apps/{APP_ID}/builds?limit=20")
          match = [b for b in builds.get("data", [])
                   if b["attributes"].get("version") == target_version
                   and b["attributes"].get("processingState") == "VALID"]
          if match:
              build_id = match[0]["id"]
              break
          print(f"  waiting for ASC build version {target_version} to be VALID (attempt {attempt+1}/20)…")
          time.sleep(30)
      if not build_id:
          raise SystemExit(f"FAIL: build version {target_version} did not become VALID in ASC within 10 min")

      print(f"Build: {build_id} (version {target_version})")

      # whatsNew on the build's beta localization
      bbl, _ = call("GET", f"/v1/builds/{build_id}/betaBuildLocalizations")
      whats_new = "Latest build. Please test the core chat functionality and report any issues."
      if bbl and bbl.get("data"):
          bbl_id = bbl["data"][0]["id"]
          call("PATCH", f"/v1/betaBuildLocalizations/{bbl_id}", {
              "data": {"type": "betaBuildLocalizations", "id": bbl_id,
                       "attributes": {"whatsNew": whats_new}}
          })
      else:
          call("POST", "/v1/betaBuildLocalizations", {
              "data": {"type": "betaBuildLocalizations",
                       "attributes": {"locale": "en-GB", "whatsNew": whats_new},
                       "relationships": {"build": {"data": {"type": "builds", "id": build_id}}}}
          })

      # Check if our target build already has a pending submission (idempotent
      # case: a previous run of this same pipeline already submitted it).
      our_sub, _ = call("GET", f"/v1/builds/{build_id}/betaAppReviewSubmission")
      if our_sub and our_sub.get("data") and our_sub["data"]["attributes"].get("betaReviewState") in ("WAITING_FOR_REVIEW","IN_REVIEW","APPROVED"):
          state = our_sub["data"]["attributes"]["betaReviewState"]
          print(f"OK: build version {target_version} already submitted — betaReviewState: {state}")
          raise SystemExit(0)

      # Submit to Beta App Review.
      result, err = call("POST", "/v1/betaAppReviewSubmissions", {
          "data": {"type": "betaAppReviewSubmissions",
                   "relationships": {"build": {"data": {"type": "builds", "id": build_id}}}}
      })

      if err and "ANOTHER_BUILD_IN_REVIEW" in err:
          # Apple only allows one external review at a time per app and the
          # API does not support cancelling a pending submission (DELETE is
          # forbidden — manual cancel via App Store Connect web UI only).
          # CI semantic: log a soft warning, succeed. Internal testers get
          # this build immediately regardless. Next push retries.
          # Identify which build is currently blocking.
          builds_resp, _ = call("GET", f"/v1/apps/{APP_ID}/builds?limit=20")
          blocking = None
          for b in (builds_resp or {}).get("data", []):
              s, _ = call("GET", f"/v1/builds/{b['id']}/betaAppReviewSubmission")
              if s and s.get("data") and s["data"]["attributes"].get("betaReviewState") == "WAITING_FOR_REVIEW":
                  blocking = b["attributes"].get("version")
                  break
          print(f"NOTE: build {target_version} not submitted — version {blocking} is still WAITING_FOR_REVIEW.")
          print("      Apple permits only one external review at a time and does not support API cancellation.")
          print("      Internal testers see this build now; external testers will get it after the next successful push,")
          print("      once the blocking review completes (or is cancelled manually in App Store Connect).")
          raise SystemExit(0)

      if not result:
          raise SystemExit("FAIL: betaAppReviewSubmissions POST failed")
      print(f"OK: submitted — betaReviewState: {result['data']['attributes']['betaReviewState']}")
      PYEOF

# ── Android: build and sign release AAB + APK ────────────────────────────────
android:build:
  stage: mobile
  tags: [preprod]
  image: gradle:8.4-jdk17
  needs: []  # independent of build:frontend — Android doesn't need the React bundle
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master"
      changes:
        - src/mobile/android/**/*
    - if: $RUN_ANDROID == "true"
  variables:
    ANDROID_HOME: /opt/android-sdk
    ANDROID_SDK_ROOT: /opt/android-sdk
  before_script:
    # Install Android SDK command-line tools + platform 35
    - apt-get update -qq && apt-get install -y -qq curl unzip
    - mkdir -p $ANDROID_HOME/cmdline-tools
    - curl -sSL -o /tmp/cli.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
    - unzip -q /tmp/cli.zip -d $ANDROID_HOME/cmdline-tools && mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
    - export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
    - yes | sdkmanager --licenses >/dev/null 2>&1 || true
    - sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools" >/dev/null
    # Reconstruct keystore from base64-encoded CI variable
    - echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/release.jks
    # Build local.properties for gradle
    - |
      cat > src/mobile/android/local.properties <<EOF
      sdk.dir=$ANDROID_HOME
      RELEASE_STORE_FILE=/tmp/release.jks
      RELEASE_KEY_ALIAS=$ANDROID_KEY_ALIAS
      RELEASE_STORE_PASSWORD=$ANDROID_KEYSTORE_PASS
      RELEASE_KEY_PASSWORD=$ANDROID_KEY_PASS
      EOF
  script:
    - cd src/mobile/android
    - chmod +x gradlew
    - ./gradlew --no-daemon bundleRelease assembleRelease
  artifacts:
    paths:
      - src/mobile/android/app/build/outputs/bundle/release/app-release.aab
      - src/mobile/android/app/build/outputs/apk/release/app-release.apk
    expire_in: 1 week

# ── Android: publish AAB to Play Store ───────────────────────────────────────
.android-publish-base:
  stage: release
  tags: [preprod]
  image: python:3.12-alpine
  needs:
    - job: android:build
      artifacts: true
  before_script:
    - pip install --quiet google-auth google-api-python-client
  script:
    - |
      python3 scripts/android_publish.py \
        --track "$PLAY_TRACK" \
        --aab src/mobile/android/app/build/outputs/bundle/release/app-release.aab \
        --key "$ANDROID_PLAY_SA_JSON" \
        --release-notes "$CI_COMMIT_TITLE"

android:publish:internal:
  extends: .android-publish-base
  variables:
    PLAY_TRACK: internal
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master"
      changes:
        - src/mobile/android/**/*
    - if: $RUN_ANDROID == "true"

android:publish:production:
  extends: .android-publish-base
  variables:
    PLAY_TRACK: production
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/
