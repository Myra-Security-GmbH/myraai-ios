site_name: AI Gateway by Myra Security — Documentation
site_description: Official documentation for AI Gateway by Myra Security — multi-tenant AI proxy for enterprise API management.
site_author: Myra Security GmbH
copyright: >
  AI Gateway by Myra Security GmbH · Proprietary

docs_dir: docs.md
site_dir: out

# ai-gateway-docs.pdf is generated post-build by gen_pdf.py and placed directly
# in docs/out/ — suppress the false-positive "not found" warning.
validation:
  links:
    not_found: ignore

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  font: false
  palette:
    scheme: default
    primary: custom
    accent: custom
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tooltips

extra_css:
  - stylesheets/brand.css
  - stylesheets/print.css

extra_javascript:
  - javascripts/mermaid-init.js

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - tables
  - md_in_html

plugins:
  - search
  - print-site:
      add_to_navigation: false
      print_page_title: "AI Gateway by Myra Security — Full Documentation"
      add_full_urls: false
      enumerate_headings: false
      enumerate_figures: false
      add_table_of_contents: true
      toc_title: "Contents"
      toc_depth: 2
      add_cover_page: true
      cover_page_template: ""
      path_to_pdf: "ai-gateway-docs.pdf"

