site_name: AI Gateway by Myra Security — Documentation
site_description: Official documentation for AI Gateway by Myra Security — multi-tenant AI proxy for enterprise API management.
site_author: Myra Security GmbH
copyright: >
  AI Gateway by Myra Security GmbH · Proprietary

docs_dir: docs.md
site_dir: out

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  font: false
  palette:
    scheme: default
    primary: custom
    accent: custom
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tooltips

extra_css:
  - stylesheets/brand.css
  - stylesheets/print.css

extra_javascript:
  - javascripts/mermaid-init.js

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - tables
  - md_in_html

plugins:
  - search
  - print-site:
      add_to_navigation: false
      print_page_title: "AI Gateway by Myra Security — Full Documentation"
      add_full_urls: false
      enumerate_headings: false
      enumerate_figures: false
      add_table_of_contents: true
      toc_title: "Contents"
      toc_depth: 2
      add_cover_page: true
      cover_page_template: ""
      path_to_pdf: "ai-gateway-docs.pdf"

nav:
  - Home: README.md
  - Getting Started:
    - getting-started/why-ai-gateway.md
    - getting-started/what-is-ai-gateway.md
    - getting-started/quick-start.md
    - getting-started/installation.md
  - Core Concepts:
    - concepts/request-pipeline.md
    - concepts/multi-tenancy.md
    - concepts/providers.md
    - concepts/caching.md
    - concepts/cost-attribution.md
  - Configuration:
    - configuration/gateway-config.md
    - configuration/rate-limiting.md
    - configuration/budgets.md
    - configuration/siem.md
  - Security:
    - security/authentication.md
    - security/byok.md
    - security/ip-allowlist.md
  - Guardrails:
    - security/guardrails.md
    - security/guardrails/regex.md
    - security/guardrails/keyword.md
    - security/guardrails/jailbreak.md
    - security/guardrails/presidio.md
    - security/guardrails/prompt-guard.md
    - security/guardrails/pii-protector.md
    - security/guardrails/json-schema.md
    - security/guardrails/contains-code.md
    - security/guardrails/gibberish.md
    - security/guardrails/language.md
  - Routing:
    - routing/routing-rules.md
    - routing/compat-endpoint.md
    - routing/fallback.md
    - routing/load-balancing.md
    - routing/circuit-breaker.md
  - Providers:
    - providers/overview.md
    - providers/openai.md
    - providers/anthropic.md
    - providers/gemini.md
    - providers/azure.md
    - providers/bedrock.md
    - providers/ollama.md
    - providers/openai-compatible.md
  - Observability:
    - observability/logging.md
    - observability/dashboard.md
    - observability/analytics.md
    - observability/tracing.md
    - observability/playground.md
    - features/web-search.md
  - API Reference:
    - api-reference/authentication.md
    - api-reference/tenants-gateways.md
    - api-reference/users-tokens.md
    - api-reference/routing-rules.md
    - api-reference/stats.md
    - api-reference/logs.md
    - api-reference/traces.md
    - api-reference/models.md
    - api-reference/error-codes.md
  - Reference:
    - reference/config-reference.md
    - What's New: reference/changelog.md
    - reference/glossary.md
    - Topic Map: reference/topic-map.md
