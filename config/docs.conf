# /etc/openresty/sites-enabled/docs.conf
# AI Gateway documentation — static site served from docs/out/

server {
    listen 127.0.0.1:8082;
    server_name localhost;

    root /home/sas/work/ai-gateway/docs/out;
    index index.html;

    # Static assets — long cache
    location ~* \.(css|js|svg|png|ico|woff2?|ttf|otf)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # SPA-style routing — try file, then directory index, then 404
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Serve llms.txt and llms-full.txt as plain text
    location ~* \.txt$ {
        default_type text/plain;
    }

    # No access logging for docs (reduce noise)
    access_log off;
}
