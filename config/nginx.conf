# config/nginx.conf — AI Gateway nginx/OpenResty configuration

# Config file location (overridable via env)
env AIG_CONFIG;
env AIG_MASTER_KEY;

events {}

http {
    # Lua package path — adjust to your deployment root
    lua_package_path '/home/sas/work/ai-gateway/src/?.lua;/home/sas/work/ai-gateway/src/?/init.lua;;';

    # Shared memory dictionaries (ephemeral state — lost on reload)
    lua_shared_dict  aig_cache      50m;   # exact-match response cache
    lua_shared_dict  aig_ratelimit  10m;   # rate limit sliding windows
    lua_shared_dict  aig_config     10m;   # hot gateway config cache
    lua_shared_dict  aig_byok        5m;   # decrypted provider keys (60s TTL)
    lua_shared_dict  aig_metrics     5m;   # prometheus counters

    # One-time initialisation (loads config file, validates backends)
    init_by_lua_block {
        local cfg = require("core.app_config")
        ngx.log(ngx.NOTICE, "AI Gateway starting — storage=", cfg.storage,
                " state=", cfg.state)
    }

    # Per-worker initialisation (opens DB handles, starts refresh timers)
    init_worker_by_lua_block {
        require("core.gateway").init_worker()
    }

    # ---------------------------------------------------------------------------
    # Main gateway vhost
    # ---------------------------------------------------------------------------
    server {
        listen 8080;
        # listen 443 ssl http2;  # enable in production
        server_name gateway.example.com;

        # Allow large request bodies for multi-modal inputs
        client_max_body_size 10m;

        # Route: /v1/{tenant}/{gateway}/{provider}/{...}
        # The named captures are set as nginx variables and also available in
        # ngx.var; middleware/tenant.lua reads ngx.var.uri to parse them.
        location ~ ^/v1/ {
            access_by_lua_block  { require("core.gateway").access()  }
            content_by_lua_block { require("core.gateway").content() }
            log_by_lua_block     { require("core.gateway").log()     }
        }

        # Prometheus metrics scrape endpoint (restrict to internal)
        location = /metrics {
            allow 127.0.0.0/8;
            allow 10.0.0.0/8;
            deny  all;
            content_by_lua_block { require("observability.metrics").expose() }
        }

        # Health check
        location = /healthz {
            content_by_lua_block { ngx.say("ok") }
        }
    }

    # ---------------------------------------------------------------------------
    # Admin API vhost (separate port; add mTLS in production)
    # ---------------------------------------------------------------------------
    server {
        listen 8081;
        server_name admin.gateway.internal;

        location ~ ^/admin/ {
            content_by_lua_block { require("admin.api").handle() }
        }
    }
}
