# ── env vars forwarded into Lua land ─────────────────────────────────────────
env AIG_CONFIG;
env AIG_MASTER_KEY;
env AIG_STORAGE;
env AIG_DATA_DIR;
env AIG_MYSQL_HOST;
env AIG_MYSQL_PORT;
env AIG_MYSQL_DB;
env AIG_MYSQL_USER;
env AIG_MYSQL_PASS;
env AIG_STATE;
env REDIS_HOST;
env REDIS_PORT;
env REDIS_AUTH;
env AIG_ADMIN_CORS_ORIGIN;
env AIG_FRONTEND_URL;
env PRESIDIO_ANALYZER_URL;
env PRESIDIO_ANONYMIZER_URL;
env PROMPT_GUARD_URL;
env OLLAMA_BASE_URL;
env AIG_LOG_PAYLOADS;
env AIG_CONFIG_CACHE_TTL;
env AIG_BYOK_CACHE_TTL;

error_log /dev/stderr notice;

events {}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    lua_package_path  '/opt/ai-gateway/src/?.lua;/opt/ai-gateway/src/?/init.lua;/opt/ai-gateway/?.lua;;';
    lua_package_cpath '/usr/lib/x86_64-linux-gnu/lua/5.1/?.so;;';
    lua_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    lua_ssl_verify_depth 3;

    lua_shared_dict  aig_cache      50m;
    lua_shared_dict  aig_ratelimit  10m;
    lua_shared_dict  aig_config     10m;
    lua_shared_dict  aig_byok        5m;
    lua_shared_dict  aig_metrics     5m;

    init_by_lua_block {
        local cfg = require("core.app_config")
        if cfg.storage == "sqlite" then
            require("lsqlite3")
            require("storage.sqlite").migrate(cfg)
        end
        ngx.log(ngx.NOTICE, "AI Gateway starting — storage=", cfg.storage,
                " state=", cfg.state)
    }

    init_worker_by_lua_block {
        rawset(_G, "sqlite3", false)
        local cfg = require("core.app_config")
        if cfg.storage == "mysql" then
            -- resty.mysql requires a socket context (not available in init_worker directly).
            -- Run via timer at(0) which fires in the coroutine scheduler after init completes.
            ngx.timer.at(0, function()
                -- Worker 0 runs schema migration (idempotent, harmless on subsequent starts).
                if ngx.worker.id() == 0 then
                    local ok, err = pcall(require("storage.mysql").migrate, cfg)
                    if not ok then
                        ngx.log(ngx.ERR, "mysql migrate: ", err)
                    end
                end
                -- All workers initialise their connection pool.
                require("core.gateway").init_worker()
            end)
        else
            require("core.gateway").init_worker()
        end
    }

    # ── Vhost 1: React SPA — ai.myra.eu ──────────────────────────────────────
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name ai.myra.eu;

        ssl_certificate     /certs/fullchain.pem;
        ssl_certificate_key /certs/privkey.pem;

        root  /opt/ai-gateway/frontend;
        index index.html;

        # Hashed assets (JS, CSS, fonts, images) — content-addressed filenames,
        # safe to cache permanently. The filename changes whenever the content does.
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # SPA entry point — filename never changes, so always revalidate.
        # no-cache still allows 304 responses from the server (fast); it only
        # prevents serving a stale copy without checking.
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }

    }

    # ── Vhost 2: Inference API — ai-api.myra.eu ──────────────────────────────
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name ai-api.myra.eu;

        ssl_certificate     /certs/fullchain.pem;
        ssl_certificate_key /certs/privkey.pem;

        client_max_body_size    10m;
        client_body_buffer_size 256k;
        send_timeout            300s;   # allow up to 5 min gap between SSE chunks to client
                                        # (long <think> blocks are stripped — nothing sent while thinking)
        resolver 127.0.0.11 valid=30s ipv6=off;   # Docker embedded DNS

        # CORS — allow the admin UI origin (playground lives there)
        set_by_lua_block $cors_origin {
            return os.getenv("AIG_ADMIN_CORS_ORIGIN") or "https://ai.myra.eu"
        }

        location ~ ^/v1/ {
            # Preflight
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin      $cors_origin always;
                add_header Access-Control-Allow-Methods     "GET, POST, OPTIONS" always;
                add_header Access-Control-Allow-Headers     "Authorization, Content-Type, x-aig-token, x-aig-skill, x-aig-web-search, x-aig-collect-log, x-aig-collect-log-payload" always;
                add_header Access-Control-Allow-Credentials "true" always;
                add_header Access-Control-Max-Age           "86400" always;
                return 204;
            }

            add_header Access-Control-Allow-Origin      $cors_origin always;
            add_header Access-Control-Allow-Credentials "true" always;

            access_by_lua_block  { require("core.gateway").access()  }
            content_by_lua_block { require("core.gateway").content() }
            log_by_lua_block     { require("core.gateway").log()     }
        }

        location = /healthz {
            content_by_lua_block { ngx.say("ok") }
        }

        location = /metrics {
            allow 127.0.0.0/8;
            allow 10.0.0.0/8;
            deny  all;
            content_by_lua_block { require("observability.metrics").expose() }
        }
    }

    # ── Vhost 3: Admin API — ai-api-admin.myra.eu ────────────────────────────
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name ai-api-admin.myra.eu;

        ssl_certificate     /certs/fullchain.pem;
        ssl_certificate_key /certs/privkey.pem;

        client_max_body_size    30m;
        client_body_buffer_size 256k;
        resolver 127.0.0.11 valid=30s ipv6=off;   # Docker embedded DNS

        location ~ ^/admin/auth/ {
            content_by_lua_block { require("admin.auth_handlers").handle() }
        }

        location ~ ^/share/ {
            content_by_lua_block { require("admin.share").handle() }
        }

        location ~ ^/admin/ {
            content_by_lua_block { require("admin.api").handle() }
        }

        location ~ ^/monitor {
            content_by_lua_block { require("admin.monitor").handle() }
        }

        location = /healthz {
            content_by_lua_block { ngx.say("ok") }
        }
    }

    # ── Vhost 4: Documentation — ai-docs.myra.eu ─────────────────────────────
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name ai-docs.myra.eu;

        ssl_certificate     /certs/fullchain.pem;
        ssl_certificate_key /certs/privkey.pem;

        root  /opt/ai-gateway/docs;
        index index.html;

        location ~* \.(css|js|svg|png|ico|woff2?)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        location / {
            try_files $uri $uri/ $uri/index.html =404;
        }

        access_log off;
    }
}
