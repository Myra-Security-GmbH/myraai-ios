# tests/mock_provider/nginx.conf
# Standalone mock LLM provider server on 127.0.0.1:19000
#
# Start:  openresty -c /home/sas/work/ai-gateway/tests/mock_provider/nginx.conf
# Stop:   openresty -c /home/sas/work/ai-gateway/tests/mock_provider/nginx.conf -s stop
# Reload: openresty -c /home/sas/work/ai-gateway/tests/mock_provider/nginx.conf -s reload

daemon off;
worker_processes 1;

error_log  /tmp/mock-provider/logs/error.log  notice;
pid        /tmp/mock-provider/nginx.pid;

events {
    worker_connections 64;
}

http {
    client_body_temp_path  /tmp/mock-provider/client_body;
    proxy_temp_path        /tmp/mock-provider/proxy;
    fastcgi_temp_path      /tmp/mock-provider/fastcgi;
    uwsgi_temp_path        /tmp/mock-provider/uwsgi;
    scgi_temp_path         /tmp/mock-provider/scgi;

    default_type application/json;

    lua_package_path '/home/sas/work/ai-gateway/tests/mock_provider/?.lua;;';

    # Call tracking (shared across workers)
    lua_shared_dict mock_calls 1m;

    server {
        listen 127.0.0.1:19000;
        server_name localhost;

        # All provider API paths
        location / {
            content_by_lua_block {
                require("handlers").handle()
            }
        }
    }
}
