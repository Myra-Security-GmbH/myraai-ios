workflows:
  screenshots:
    name: App Store Screenshots
    # Trigger manually from the Codemagic UI — not part of every push.
    # Produces PNG files as build artefacts ready to upload to App Store Connect.
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      groups:
        - test   # provides TEST_LOGIN_EMAIL and TEST_LOGIN_OTP
      vars:
        XCODE_PROJECT: "MYRAai.xcodeproj"
        XCODE_SCHEME: "MYRAai"
      xcode: "16"  # Xcode 16 (iOS 18) has iPhone 14 Plus simulator; Xcode 26 only has iPhone 17 series
    scripts:
      - name: Capture screenshots — iPhone 14 Plus (6.7", 1284×2778 — required by ASC)
        script: |
          set -e
          # ASC requires 1284×2778 (6.7") or 1242×2688 (6.5") screenshots.
          # iPhone 14 Plus and iPhone 13 Pro Max both produce 1284×2778 at 3x.
          SIM=$(xcrun simctl list devices available | grep -oE "iPhone (14 Plus|13 Pro Max)" | head -1)
          [ -z "$SIM" ] && SIM="iPhone 14 Plus"
          echo "Simulator: $SIM"

          OUT="$CM_BUILD_DIR/screenshots/iphone_6_7"
          mkdir -p "$OUT"

          # Fail loudly if the 'test' variable group didn't inject credentials.
          echo "TEST_LOGIN_EMAIL set: $([ -n "$TEST_LOGIN_EMAIL" ] && echo yes || echo NO)"
          if [ -z "$TEST_LOGIN_EMAIL" ] || [ -z "$TEST_LOGIN_OTP" ]; then
            echo "ERROR: TEST_LOGIN_EMAIL or TEST_LOGIN_OTP is empty — check the Codemagic variable group 'test'"
            exit 1
          fi

          # Xcode does not reliably forward shell environment into the XCUITest runner
          # process.  Write a JSON sidecar that the Swift test reads from /tmp.
          printf '{"email":"%s","otp":"%s","output_dir":"%s"}' \
            "$TEST_LOGIN_EMAIL" "$TEST_LOGIN_OTP" "$OUT" \
            > /tmp/myra_screenshot_creds.json
          echo "Credentials written to /tmp/myra_screenshot_creds.json"

          xcodebuild test \
            -project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "platform=iOS Simulator,name=$SIM,OS=latest" \
            -only-testing:MYRAaiUITests/ScreenshotTests/test_capture_app_store_screenshots \
            -resultBundlePath "$CM_BUILD_DIR/result_6_7.xcresult" \
            CODE_SIGNING_ALLOWED=NO

          echo "PNG files written:"
          ls -lh "$OUT"/*.png 2>/dev/null || echo "  (none — check XCTAttachments in xcresult)"
    artifacts:
      - screenshots/**/*.png
    publishing:
      email:
        recipients:
          - sascha@schumann.net
        notify:
          success: true
          failure: true

  ios-app-store:
    name: MYRAai App Store
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: eu.myra.myraai
      groups:
        - test  # provides TEST_LOGIN_EMAIL and TEST_LOGIN_OTP for UI tests; never logged in build output
      vars:
        XCODE_PROJECT: "MYRAai.xcodeproj"
        XCODE_SCHEME: "MYRAai"
        DEVELOPMENT_TEAM: "A4C54HLPJ7"
        SIGN_ID: "Apple Distribution: SASCHA SCHUMANN (A4C54HLPJ7)"
        PROFILE_NAME: "MYRAai Distribution"
      xcode: latest
    scripts:
      - name: Verify project readable
        script: |
          xcodebuild -list -project "$CM_BUILD_DIR/$XCODE_PROJECT"
      - name: Smoke test in iOS Simulator
        script: |
          set -e
          # Picks the newest available iPhone simulator name to avoid hardcoding
          # a specific iPhone model that may not exist on this Mac mini.
          SIM_NAME=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone [0-9]+ /{print $0; exit}' | sed 's/ *(.*//;s/^ *//')
          [ -z "$SIM_NAME" ] && SIM_NAME="iPhone 15"
          echo "Using simulator: $SIM_NAME"
          xcodebuild test \
            -project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "platform=iOS Simulator,name=$SIM_NAME,OS=latest" \
            -only-testing:MYRAaiUITests \
            CODE_SIGNING_ALLOWED=NO
      - name: Inspect installed provisioning profile
        script: |
          for PROFILE in ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision; do
            echo "=== $PROFILE ==="
            security cms -D -i "$PROFILE" | python3 -c "
          import sys, plistlib, io
          p = plistlib.load(io.BytesIO(sys.stdin.buffer.read()))
          ent = p.get('Entitlements') or {}
          print('  Name:           ', p.get('Name'))
          print('  UUID:            ', p.get('UUID'))
          print('  CreationDate:    ', p.get('CreationDate'))
          print('  AppIDName:       ', p.get('AppIDName'))
          print('  application-id:  ', ent.get('application-identifier'))
          print('  aps-environment: ', ent.get('aps-environment'))
          print('  All entitlement keys:', sorted(ent.keys()))
          "
          done
      - name: Archive
        script: |
          xcodebuild archive \
            -project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -archivePath "$CM_BUILD_DIR/MYRAai.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            "CODE_SIGN_IDENTITY=$SIGN_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            CURRENT_PROJECT_VERSION=$BUILD_NUMBER \
            -verbose
      - name: Export IPA
        script: |
          xcodebuild -exportArchive \
            -archivePath "$CM_BUILD_DIR/MYRAai.xcarchive" \
            -exportPath "$CM_BUILD_DIR/build/ios/ipa" \
            -exportOptionsPlist "$CM_BUILD_DIR/ExportOptions.plist"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        # Submission to Beta App Review is handled by the GitLab
        # 'ios:submit-for-review' job, which tolerates ANOTHER_BUILD_IN_REVIEW
        # as a soft warning. Letting Codemagic also submit causes both to race
        # and Codemagic fails the build whenever a previous review is pending.
        submit_to_testflight: false
        submit_to_app_store: false
      email:
        recipients:
          - sascha@schumann.net
        notify:
          success: true
          failure: true
