workflows:
  ios-app-store:
    name: MYRAai App Store
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: eu.myra.myraai
      groups:
        - test  # provides TEST_LOGIN_EMAIL and TEST_LOGIN_OTP for UI tests; never logged in build output
      vars:
        XCODE_PROJECT: "MYRAai.xcodeproj"
        XCODE_SCHEME: "MYRAai"
        DEVELOPMENT_TEAM: "A4C54HLPJ7"
        SIGN_ID: "Apple Distribution: SASCHA SCHUMANN (A4C54HLPJ7)"
        PROFILE_NAME: "MYRAai Distribution"
      xcode: latest
    scripts:
      - name: Verify project readable
        script: |
          xcodebuild -list -project "$CM_BUILD_DIR/$XCODE_PROJECT"
      - name: Smoke test in iOS Simulator
        script: |
          set -e
          # Picks the newest available iPhone simulator name to avoid hardcoding
          # a specific iPhone model that may not exist on this Mac mini.
          SIM_NAME=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone [0-9]+ /{print $0; exit}' | sed 's/ *(.*//;s/^ *//')
          [ -z "$SIM_NAME" ] && SIM_NAME="iPhone 15"
          echo "Using simulator: $SIM_NAME"
          xcodebuild test \
            -project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "platform=iOS Simulator,name=$SIM_NAME,OS=latest" \
            -only-testing:MYRAaiUITests \
            CODE_SIGNING_ALLOWED=NO
      - name: Archive
        script: |
          xcodebuild archive \
            -project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -archivePath "$CM_BUILD_DIR/MYRAai.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            "CODE_SIGN_IDENTITY=$SIGN_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            CURRENT_PROJECT_VERSION=$BUILD_NUMBER \
            -verbose
      - name: Export IPA
        script: |
          xcodebuild -exportArchive \
            -archivePath "$CM_BUILD_DIR/MYRAai.xcarchive" \
            -exportPath "$CM_BUILD_DIR/build/ios/ipa" \
            -exportOptionsPlist "$CM_BUILD_DIR/ExportOptions.plist"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
      email:
        recipients:
          - sascha@schumann.net
        notify:
          success: true
          failure: true
