workflows:
  ios-app-store:
    name: MYRAai App Store
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic   # App Store Connect API key configured in Codemagic UI
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: eu.myra.myraai
      vars:
        XCODE_PROJECT: "MYRAai.xcodeproj"
        XCODE_SCHEME: "MYRAai"
        BUNDLE_ID: "eu.myra.myraai"
      xcode: latest
    scripts:
      - name: Set build number from Codemagic build number
        script: |
          cd $CM_BUILD_DIR
          agvtool new-version -all $BUILD_NUMBER
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
      email:
        recipients:
          - sascha@schumann.net
        notify:
          success: true
          failure: true
