// Top-level build file — configuration common to all subprojects/modules.
plugins {
    id 'com.android.application' version '8.3.1' apply false
    id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
    // Firebase setup. The plugin is declared here but only applied in the
    // app module when google-services.json is present (see app/build.gradle).
    // CI must drop google-services.json into src/mobile/android/app/ before
    // ./gradlew bundleRelease runs.
    id 'com.google.gms.google-services' version '4.4.2' apply false
}
