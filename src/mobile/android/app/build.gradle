plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Apply the Google Services plugin only when google-services.json is present.
// Without it the Firebase SDK still compiles in but is uninitialised at runtime,
// so the app keeps building and running without push for local-dev / CI builds
// that haven't been configured for Firebase yet. See FIREBASE_SETUP.md.
def googleServicesJson = file('google-services.json')
if (googleServicesJson.exists()) {
    apply plugin: 'com.google.gms.google-services'
} else {
    logger.warn("⚠ google-services.json not found at ${googleServicesJson} — building without FCM. See FIREBASE_SETUP.md.")
}

def keystoreProps = new Properties()
def keystoreFile = rootProject.file("local.properties")
if (keystoreFile.exists()) keystoreProps.load(new FileInputStream(keystoreFile))

android {
    namespace 'eu.myra.myraai'
    compileSdk 35

    defaultConfig {
        applicationId "eu.myra.myraai"
        minSdk 26
        targetSdk 35
        // versionCode must be strictly increasing per Play Store upload —
        // re-using a value gets rejected with "Version code N has already
        // been used". CI sets ANDROID_VERSION_CODE to $CI_PIPELINE_IID
        // (project-local monotonic counter, see .gitlab-ci.yml). Local
        // builds get a high sentinel so an accidental upload from a dev
        // machine still won't collide with the next CI value (CI is at ~172
        // and grows by 1 per push).
        versionCode (System.getenv("ANDROID_VERSION_CODE")?.toInteger() ?: 99999)
        versionName "1.0.4"
    }

    signingConfigs {
        release {
            storeFile     file(keystoreProps['RELEASE_STORE_FILE'] ?: '/dev/null')
            storePassword keystoreProps['RELEASE_STORE_PASSWORD'] ?: ''
            keyAlias      keystoreProps['RELEASE_KEY_ALIAS']      ?: ''
            keyPassword   keystoreProps['RELEASE_KEY_PASSWORD']   ?: ''
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    bundle {
        language {
            enableSplit = false
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.google.android.gms:play-services-auth:21.2.0'

    // Firebase Cloud Messaging — pinned via BOM for cross-module version lock.
    // The SDK is included unconditionally so MyraFirebaseMessagingService
    // compiles; Firebase is only initialised at runtime when the
    // google-services plugin has been applied (see top of this file).
    implementation platform('com.google.firebase:firebase-bom:33.5.0')
    implementation 'com.google.firebase:firebase-messaging-ktx'
}
