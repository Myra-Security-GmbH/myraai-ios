<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- AGF-3758: the navigation fence of every sandboxed preview. A frame's OWN navigation is limited only by its
     EMBEDDER's frame-src, so the preview runs one frame below this document, whose policy allows no frame
     navigation at all (the preview's own srcdoc is not a fetch and still loads). Measured in Chromium, Firefox and
     WebKit. The preview's own CSP (SANDBOX_CSP / the MCP app CSP) and the app's CSP are unchanged.
     Delivered as the srcdoc of SandboxFrame's iframe (imported ?raw): no request, no server route, works offline
     and in every shell. -->
<meta http-equiv="Content-Security-Policy" content="frame-src 'none'; child-src 'none'">
<title>sandbox</title>
<style>html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:transparent}iframe{display:block;border:0;width:100%;height:100%}</style>
</head>
<body>
<script>
(function () {
  "use strict";
  // Framed by the app only. Opened top-level (or in a window we did not frame) it does nothing.
  if (window.parent === window) return;
  var ENVELOPE = "__aigSandboxHost";
  var FLAGS = { "allow-scripts": true };   // the only flags a preview ever gets (no allow-same-origin)
  function allowed(flag) { return Object.prototype.hasOwnProperty.call(FLAGS, flag); }   // never an inherited key
  var inner = null;                         // the CURRENT preview frame — a fresh one per document
  var shown = null;                         // the document + flags it shows

  function render(msg) {
    if (typeof msg.srcdoc !== "string" || typeof msg.sandbox !== "string") return;
    var flags = msg.sandbox.split(/\s+/).filter(Boolean);
    for (var i = 0; i < flags.length; i++) if (!allowed(flags[i])) return;   // unknown flag: render nothing
    var key = flags.join(" ") + "\n" + msg.srcdoc;
    if (inner && shown === key) return;     // the same document again: keep the running one
    shown = key;
    if (inner) inner.remove();              // its late messages no longer match `inner` below
    inner = document.createElement("iframe");
    inner.setAttribute("sandbox", flags.join(" "));
    inner.setAttribute("title", "");          // the app's frame carries the title (announced once)
    inner.srcdoc = msg.srcdoc;
    document.body.appendChild(inner);
  }

  window.addEventListener("message", function (ev) {
    var d = ev.data;
    if (ev.source === window.parent) {
      if (d && typeof d === "object" && d[ENVELOPE] === "render") { render(d); return; }
      if (inner && inner.contentWindow) inner.contentWindow.postMessage(d, "*", ev.ports ? Array.prototype.slice.call(ev.ports) : []);
      return;
    }
    if (inner && ev.source === inner.contentWindow) {
      window.parent.postMessage(d, "*", ev.ports ? Array.prototype.slice.call(ev.ports) : []);
    }
  });
})();
</script>
</body>
</html>
